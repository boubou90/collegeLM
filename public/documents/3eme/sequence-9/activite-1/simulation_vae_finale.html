<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulation interactive d'un VAE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;background:#f0f2f5;padding:1rem;font-family:system-ui,sans-serif}
.page{display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%;max-width:940px}
.titre{font-size:22px;font-weight:500;color:#1a1a2e;text-align:center}
.wrap{display:flex;align-items:stretch;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 4px 28px rgba(0,0,0,.18)}
.left{background:#1c2130;display:flex;flex-direction:column;flex:1;min-width:0;border:1px solid #2a2e40;border-right:none}
canvas{display:block;width:100%}
.ctrl{background:#141720;border-top:2px solid #24273a;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cl{font-size:10px;font-weight:700;color:#7888a8;text-transform:uppercase;letter-spacing:.1em}
.sr,.mr{display:flex;gap:6px}
.sb,.mb{font-size:11.5px;font-weight:700;padding:7px 0;border-radius:9px;cursor:pointer;flex:1;text-align:center;border:2px solid;transition:all .18s}
.sb{background:#1c2235;color:#7888a8;border-color:#2c3050}
.sb.on{background:#fff!important;border-color:#fff!important;color:#111!important}
.mb-eco{background:#052a14;border-color:#22c55e;color:#4ade80}.mb-eco.on{background:#fff!important;border-color:#fff!important;color:#111!important}
.mb-sport{background:#2a1200;border-color:#f97316;color:#fb923c}.mb-sport.on{background:#fff!important;border-color:#fff!important;color:#111!important}
.mb-turbo{background:#2a0606;border-color:#ef4444;color:#f87171}.mb-turbo.on{background:#fff!important;border-color:#fff!important;color:#111!important}
.mb-off{background:#1e2030;border-color:#6b7280;color:#9ca3af}.mb-off.on{background:#fff!important;border-color:#fff!important;color:#111!important}
.right{background:#070707;border-left:2px solid #1e1e1e;width:320px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem 1rem;gap:1rem}
.board-lbl{font-size:10px;color:#fff;text-transform:uppercase;letter-spacing:.12em}
.scr{background:#040404;border-radius:14px;padding:18px 16px 14px;width:100%;border:1px solid #1c1c1c;display:flex;flex-direction:column;gap:13px}
.tr{display:flex;justify-content:space-between;align-items:flex-end}
.sc{display:flex;flex-direction:column;align-items:center;flex:1}
.sn{font-size:60px;font-weight:700;color:#fff;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.su{font-size:11px;color:#fff;margin-top:3px;text-transform:uppercase;letter-spacing:1px}
.ac{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px}
.al{font-size:9px;color:#fff;text-transform:uppercase;letter-spacing:1px}
.dr{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:#1a1a1a;transition:background .3s}
.dot.a1{background:#22c55e}.dot.a2{background:#f97316}.dot.a3{background:#ef4444}
.am{font-size:13px;font-weight:700;color:#22c55e;transition:color .3s}
.dv{height:1px;background:#1a1a1a}
.bs{display:flex;flex-direction:column;gap:5px}
.bh{display:flex;justify-content:space-between;align-items:center}
.bl{font-size:9px;color:#fff;text-transform:uppercase;letter-spacing:1px}
.br{display:flex;align-items:center;gap:6px}
.cb{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;transition:all .3s}
.bp{font-size:15px;font-weight:700;color:#22c55e;transition:color .3s;font-variant-numeric:tabular-nums}
.bt{background:#0e0e0e;border-radius:4px;height:8px;overflow:hidden;border:1px solid #1a1a1a}
.bf{height:100%;border-radius:4px;background:#22c55e;transition:width .4s ease,background .4s}
.sr2{display:flex;justify-content:space-between}
.si{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.sl{font-size:9px;color:#fff;text-transform:uppercase;letter-spacing:.8px}
.sv{font-size:17px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.su2{font-size:8px;color:#fff}
.sd{width:1px;background:#1a1a1a;align-self:stretch;margin:3px 0}
.pl{width:8px;height:8px;background:#22c55e;border-radius:50%;margin:0 auto;box-shadow:0 0 6px #22c55e}
.lg{display:flex;justify-content:center;gap:12px;background:#0d0d0d;border-radius:7px;padding:7px 10px;width:100%}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#fff;font-weight:500}
.ld{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>
<div class="page">
  <p class="titre">Simulation interactive d'un VAE</p>
  <div class="wrap">
    <div class="left">
      <canvas id="vc"></canvas>
      <div class="ctrl">
        <div class="cl">Scénario</div>
        <div class="sr">
          <button class="sb" onclick="setSc('city',this)">🛣 Plat</button>
          <button class="sb" onclick="setSc('hill',this)">⛰ Côte</button>
          <button class="sb on" onclick="setSc('stop',this)">🛑 Arrêt</button>
        </div>
        <div class="cl">Mode d'assistance</div>
        <div class="mr">
          <button class="mb mb-eco" onclick="setMd(1,this)">🟢 ECO</button>
          <button class="mb mb-sport" onclick="setMd(2,this)">🟠 SPORT</button>
          <button class="mb mb-turbo" onclick="setMd(3,this)">🔴 TURBO</button>
          <button class="mb mb-off on" onclick="setMd(0,this)">⚫ OFF</button>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="board-lbl">Écran de bord</div>
      <div class="scr">
        <div class="tr">
          <div class="sc"><div class="sn" id="spd">0</div><div class="su">km / h</div></div>
          <div class="ac">
            <div class="al">Assistance</div>
            <div class="dr"><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
            <div class="am" id="am">ECO</div>
          </div>
        </div>
        <div class="dv"></div>
        <div class="bs">
          <div class="bh"><span class="bl">Batterie</span>
            <div class="br">
              <span class="cb" id="cb" style="background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)">▼ ECO</span>
              <span class="bp" id="bp">78.0 %</span>
            </div>
          </div>
          <div class="bt"><div class="bf" id="bf" style="width:78%"></div></div>
        </div>
        <div class="dv"></div>
        <div class="sr2">
          <div class="si"><div class="sl">Distance</div><div class="sv" id="dist">0.0</div><div class="su2">km</div></div>
          <div class="sd"></div>
          <div class="si"><div class="sl">Puissance</div><div class="sv" id="watt">0</div><div class="su2">W</div></div>
          <div class="sd"></div>
          <div class="si"><div class="sl">Autonomie</div><div class="sv" id="rng">42</div><div class="su2">km</div></div>
        </div>
      </div>
      <div class="pl" id="pl"></div>
      <div class="lg">
        <div class="li"><div class="ld" style="background:#22c55e;box-shadow:0 0 4px #22c55e"></div>ECO</div>
        <div class="li"><div class="ld" style="background:#f97316;box-shadow:0 0 4px #f97316"></div>SPORT</div>
        <div class="li"><div class="ld" style="background:#ef4444;box-shadow:0 0 4px #ef4444"></div>TURBO</div>
      </div>
    </div>
  </div>
</div>

const BADGE={0:{l:'● OFF',bg:'rgba(107,114,128,.15)',c:'#9ca3af',b:'rgba(107,114,128,.3)'},1:{l:'▼ ECO',bg:'rgba(34,197,94,.15)',c:'#22c55e',b:'rgba(34,197,94,.3)'},2:{l:'▼▼ SPORT',bg:'rgba(249,115,22,.15)',c:'#f97316',b:'rgba(249,115,22,.3)'},3:{l:'▼▼▼ TURBO',bg:'rgba(239,68,68,.15)',c:'#ef4444',b:'rgba(239,68,68,.3)'}};
const MC=['#6b7280','#22c55e','#f97316','#ef4444'],MN=['OFF','ECO','SPORT','TURBO'];
let sc='stop',md=0,al=0,bgX=0,bY=0,bD=1,parts=[],dist=0,batt=100,spd=0,watt=0;
const tS=()=>TS[sc]?.[md]??0,tW=()=>TW[sc]?.[md]??0;

function dash(){
  document.getElementById('spd').textContent=Math.round(spd);
  document.getElementById('watt').textContent=Math.round(watt);
  document.getElementById('dist').textContent=dist.toFixed(1);
  ['d1','d2','d3'].forEach((id,i)=>document.getElementById(id).className='dot'+(al>=i+1?' a'+(i+1):''));
  document.getElementById('am').textContent=MN[al]||'OFF';document.getElementById('am').style.color=MC[al]||'#888';
  if(spd>0.5)batt=Math.max(0,batt-DR[md]*0.25);
  const p=Math.round(batt*10)/10;
  document.getElementById('bp').textContent=p.toFixed(1)+' %';
  document.getElementById('bf').style.width=batt+'%';
  const bc=batt>40?'#22c55e':batt>20?'#f97316':'#ef4444';
  document.getElementById('bf').style.background=bc;document.getElementById('bp').style.color=bc;
  document.getElementById('rng').textContent=Math.round(batt*0.54);
  document.getElementById('pl').style.background=bc;document.getElementById('pl').style.boxShadow=`0 0 6px ${bc}`;
  const info=BADGE[md]||BADGE[0];const cb=document.getElementById('cb');
  cb.textContent=info.l;cb.style.background=info.bg;cb.style.color=info.c;cb.style.border=`1px solid ${info.b}`;
}
let tick=null;
function startTick(){if(tick)clearInterval(tick);dist=0;tick=setInterval(()=>{al=md;const ts=batt<=0?TS[sc]?.[0]??0:tS(),tw=batt<=0?0:tW();spd+=(ts-spd)*0.12;watt+=(tw-watt)*0.12;if(Math.abs(spd-ts)<0.1)spd=ts;if(Math.abs(watt-tw)<1)watt=tw;dist+=(spd/3600)*0.25;dash();},250);}
function setSc(s,btn){sc=s;bgX=0;parts=[];document.querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function setMd(m,btn){md=m;al=m;document.querySelectorAll('.mb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

function terrain(){const W=cv.width,vx=W/2,pts=[];for(let x=-10;x<=W+10;x+=4){let y;if(sc==='city')y=BASE_Y+Math.sin((x+bgX)*.038)*2;else if(sc==='hill')y=BASE_Y-6+(vx-x)*HILL_S;else y=BASE_Y+Math.sin(x*.036)*1.5;pts.push({x,y});}return pts;}
function gY(pts,x){for(let i=0;i<pts.length-1;i++)if(pts[i].x<=x&&pts[i+1].x>x){const f=(x-pts[i].x)/(pts[i+1].x-pts[i].x);return pts[i].y+f*(pts[i+1].y-pts[i].y);}return BASE_Y;}
function gS(pts,x){for(let i=0;i<pts.length-1;i++)if(pts[i].x<=x&&pts[i+1].x>x)return Math.atan2(pts[i+1].y-pts[i].y,pts[i+1].x-pts[i].x);return 0;}
function cloud(x,y,s){cx.save();cx.translate(x,y);cx.scale(s,s);cx.fillStyle='rgba(255,255,255,.9)';cx.beginPath();cx.arc(0,0,18,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(22,-5,14,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(42,0,16,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(21,8,12,0,Math.PI*2);cx.fill();cx.restore();}

function bg(){
  const W=cv.width,vx=W/2;
  const sky=cx.createLinearGradient(0,0,0,CH*.68);
  if(sc==='hill'){sky.addColorStop(0,'#a8c8e8');sky.addColorStop(1,'#c8e4f8');}
  else if(sc==='stop'){sky.addColorStop(0,'#b8c8d8');sky.addColorStop(1,'#d0dce8');}
  else{sky.addColorStop(0,'#7ec4f0');sky.addColorStop(1,'#c4e8fc');}
  cx.fillStyle=sky;cx.fillRect(0,0,W,CH);
  const sg=cx.createRadialGradient(W-50,35,0,W-50,35,50);
  sg.addColorStop(0,'#fff8c0');sg.addColorStop(.4,'#ffe060');sg.addColorStop(1,'rgba(255,200,0,0)');
  cx.save();cx.globalAlpha=sc==='stop'?.35:.78;cx.fillStyle=sg;cx.fillRect(0,0,W,CH);cx.restore();
  [{x:50,y:35,s:1.1},{x:210,y:22,s:.9},{x:360,y:44,s:1.2}].forEach(c=>{
    cloud(((c.x-bgX*.07+W*8)%(W+170))-80,c.y,c.s);
  });
  if(sc==='city'){
    const pal=['#90aec8','#a8a0c8','#90b8a8','#c0a890','#a098b8'];
    [{x:255,w:32,h:56},{x:295,w:22,h:38},{x:325,w:36,h:68},{x:160,w:28,h:46},{x:372,w:30,h:52}].forEach((b,ci)=>{
      const bx=((b.x-bgX*.1+W*8)%(W+300))-120;
      cx.fillStyle=pal[ci%5];cx.fillRect(bx,BASE_Y-6-b.h,b.w,b.h);
      for(let wy=BASE_Y-6-b.h+8;wy<BASE_Y-12;wy+=11)
        for(let wx=bx+5;wx<bx+b.w-5;wx+=9){cx.fillStyle='rgba(255,255,220,.7)';cx.fillRect(wx,wy,4,6);}
      cx.fillStyle='rgba(0,0,0,.12)';cx.fillRect(bx,BASE_Y-8-b.h,b.w,4);
    });
  }
  if(sc==='hill'){
    cx.save();cx.globalAlpha=.2;cx.fillStyle='#6070a0';
    cx.beginPath();cx.moveTo(0,200);cx.lineTo(100,110);cx.lineTo(190,158);cx.lineTo(295,94);cx.lineTo(W,110);cx.lineTo(W,200);cx.closePath();cx.fill();cx.restore();
    [{tx:40,h:70,s:1.0},{tx:130,h:88,s:1.2},{tx:230,h:72,s:0.9},{tx:320,h:95,s:1.3},{tx:420,h:80,s:1.1}].forEach(({tx,h,s})=>{
      const bx=((tx-bgX*.15+W*8)%(W+200))-100;
      const by=BASE_Y-2+(vx-bx)*HILL_S;
      cx.save();cx.translate(bx,by);
      const tw=Math.round(5*s),th=Math.round(18*s);
      const tg=cx.createLinearGradient(-tw,0,tw,0);
      tg.addColorStop(0,'#5a3310');tg.addColorStop(.4,'#8b5e2a');tg.addColorStop(1,'#4a2808');
      cx.fillStyle=tg;cx.beginPath();cx.roundRect(-tw,-th,tw*2,th+2,2);cx.fill();
      const lh=Math.round(h*s);
      const g1=cx.createLinearGradient(-Math.round(24*s),-th,Math.round(24*s),-th);
      g1.addColorStop(0,'#1a4a10');g1.addColorStop(.5,'#2d7a1a');g1.addColorStop(1,'#1a4a10');
      cx.fillStyle=g1;cx.beginPath();cx.moveTo(0,-th-Math.round(lh*.55));cx.lineTo(-Math.round(24*s),-th);cx.lineTo(Math.round(24*s),-th);cx.closePath();cx.fill();
      const g2=cx.createLinearGradient(-Math.round(18*s),-th-Math.round(lh*.45),Math.round(18*s),-th-Math.round(lh*.45));
      g2.addColorStop(0,'#1e5814');g2.addColorStop(.5,'#348c20');g2.addColorStop(1,'#1e5814');
      cx.fillStyle=g2;cx.beginPath();cx.moveTo(0,-th-Math.round(lh*.85));cx.lineTo(-Math.round(18*s),-th-Math.round(lh*.38));cx.lineTo(Math.round(18*s),-th-Math.round(lh*.38));cx.closePath();cx.fill();
      const g3=cx.createLinearGradient(-Math.round(11*s),-th-Math.round(lh*.75),Math.round(11*s),-th-Math.round(lh*.75));
      g3.addColorStop(0,'#245e16');g3.addColorStop(.5,'#3aaa22');g3.addColorStop(1,'#245e16');
      cx.fillStyle=g3;cx.beginPath();cx.moveTo(0,-th-Math.round(lh));cx.lineTo(-Math.round(11*s),-th-Math.round(lh*.7));cx.lineTo(Math.round(11*s),-th-Math.round(lh*.7));cx.closePath();cx.fill();
      cx.restore();
    });
    cx.fillStyle='rgba(234,88,12,.9)';cx.beginPath();cx.roundRect(10,10,112,30,7);cx.fill();
    cx.fillStyle='#fff';cx.font='bold 12px sans-serif';cx.textAlign='left';cx.fillText('⛰  Pente +10 %',17,29);
  }
  if(sc==='stop'){
    const sx=((355-bgX*.04+W*8)%(W+300))-120;
    cx.fillStyle='#7a3a10';cx.fillRect(sx,BASE_Y-64,7,64);
    cx.fillStyle='#c00000';cx.strokeStyle='#ff2020';cx.lineWidth=3;
    cx.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2-Math.PI/8;i===0?cx.moveTo(sx+3+Math.cos(a)*17,BASE_Y-76+Math.sin(a)*17):cx.lineTo(sx+3+Math.cos(a)*17,BASE_Y-76+Math.sin(a)*17);}
    cx.closePath();cx.fill();cx.stroke();
    cx.fillStyle='#fff';cx.font='bold 8px sans-serif';cx.textAlign='center';cx.fillText('STOP',sx+3,BASE_Y-73);
  }
}

function drawTerrain(pts){
  const W=cv.width;
  const g=cx.createLinearGradient(0,BASE_Y-12,0,CH);
  g.addColorStop(0,'#6ab83a');g.addColorStop(.2,'#4e9a20');g.addColorStop(1,'#2e6010');
  cx.beginPath();cx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>cx.lineTo(p.x,p.y));cx.lineTo(W+10,CH);cx.lineTo(-10,CH);cx.closePath();cx.fillStyle=g;cx.fill();
  cx.beginPath();cx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>cx.lineTo(p.x,p.y));cx.strokeStyle='#3a8810';cx.lineWidth=2.5;cx.stroke();
  if(sc==='city'){
    const rg=cx.createLinearGradient(0,BASE_Y,0,BASE_Y+28);rg.addColorStop(0,'#8a9098');rg.addColorStop(1,'#6a7078');
    cx.beginPath();pts.forEach((p,i)=>i===0?cx.moveTo(p.x,p.y):cx.lineTo(p.x,p.y));cx.lineTo(W+10,BASE_Y+28);cx.lineTo(-10,BASE_Y+28);cx.closePath();cx.fillStyle=rg;cx.fill();
    cx.save();cx.setLineDash([26,16]);cx.lineDashOffset=bgX%42;cx.strokeStyle='rgba(255,255,255,.75)';cx.lineWidth=3;
    cx.beginPath();cx.moveTo(0,BASE_Y+11);cx.lineTo(W,BASE_Y+11);cx.stroke();cx.setLineDash([]);cx.restore();
  }
  if(sc==='hill'){
    cx.save();cx.setLineDash([18,30]);cx.lineDashOffset=bgX*.7%48;cx.strokeStyle='rgba(255,255,255,.32)';cx.lineWidth=2.5;
    cx.beginPath();pts.forEach((p,i)=>i===0?cx.moveTo(p.x,p.y+3):cx.lineTo(p.x,p.y+3));cx.stroke();cx.setLineDash([]);cx.restore();
  }
}

// ── Image pré-rotée : aucune rotation JS ──
const bikeImg=new Image();
let bikeReady=false;
bikeImg.onload=()=>{bikeReady=true;};
bikeImg.src=BIKE_SRC;
const FW=138,FH=156,ANC_X=39.7,ANC_Y=149.6;

function drawBike(gx,gy,slope){
  if(!bikeReady)return;
  const mv=spd>0.5;
  const bob=mv?(sc==='city'?Math.sin(Date.now()*.008)*.4:Math.sin(Date.now()*.008)*1.5):0;
  cx.save();
  cx.translate(gx,gy+bob);
  cx.rotate(slope);
  cx.drawImage(bikeImg,-ANC_X,-ANC_Y,FW,FH);
  cx.restore();
}

function spawn(){if(al===0||spd<1)return;const c=al===3?'rgba(239,68,68,.9)':al===2?'rgba(249,115,22,.9)':'rgba(34,197,94,.9)';const vx=cv.width/2;parts.push({x:vx-110,y:BASE_Y+4,vx:-(Math.random()*2+.6),vy:(Math.random()-.5)*.8,life:1,r:Math.random()*4.5+2,c});}

function loop(){
  const mv=spd>0.5,W=cv.width,vx=W/2;
  if(mv){bgX+=spd*.18;bY+=bD*.12*(spd/22);if(Math.abs(bY)>.8)bD*=-1;}
  else bY*=.83;
  if(mv&&al>0&&Math.random()<.35)spawn();
  parts=parts.filter(p=>p.life>.04);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life*=.87;});
  cx.clearRect(0,0,W,CH);bg();
  const pts=terrain();drawTerrain(pts);
  const gy=gY(pts,vx),sl=gS(pts,vx);
  parts.forEach(p=>{cx.save();cx.globalAlpha=p.life*.7;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();cx.restore();});
  drawBike(vx,gy+bY,sl);
  cx.save();cx.fillStyle='rgba(0,0,0,.55)';cx.beginPath();cx.roundRect(8,CH-26,W-16,20,5);cx.fill();
  const ts=tS();
  const lbl={city:`Trajet plat — cible ${ts} km/h`,hill:`Montée côte — cible ${ts} km/h`,stop:'Arrêt — vélo immobile'};
  const dc={city:'#38d4ff',hill:'#fb923c',stop:'#a78bfa'};
  cx.fillStyle=dc[sc];cx.beginPath();cx.arc(20,CH-16,4.5,0,Math.PI*2);cx.fill();
  cx.fillStyle='rgba(255,255,255,.85)';cx.font='bold 10.5px sans-serif';cx.textAlign='left';cx.fillText(lbl[sc],30,CH-12);cx.restore();
  requestAnimationFrame(loop);
}
startTick();requestAnimationFrame(loop);
</script>
